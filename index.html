<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abismo Carmesí · Prototipo v0.1</title>
  <style>
    :root {
      --fondo: #0d0d10;
      --panel: #15151b;
      --texto: #e8e8ee;
      --tenue: #8a8a99;
      --linea: #2a2a35;
      --azul: #4a94ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 16px 32px;
      background: var(--fondo);
      color: var(--texto);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { text-align: center; }
    h1 { margin: 0; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; }
    .sub { margin: 2px 0 0; color: var(--tenue); font-size: 12.5px; }
    #marco {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 11;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 1px solid var(--linea);
      border-radius: 10px;
      background: #000;
    }
    #menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      text-align: center;
      background: rgba(9, 9, 13, .86);
      border: 1px solid var(--linea);
      border-radius: 10px;
    }
    #menu[hidden] { display: none; }
    #menu h2 { margin: 0; font-size: 20px; font-weight: 600; }
    #menu p { margin: 0; color: var(--tenue); font-size: 13px; }
    #armas { display: grid; gap: 8px; width: min(100%, 360px); }
    .arma {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 14px;
      text-align: left;
      color: var(--texto);
      background: var(--panel);
      border: 1px solid var(--linea);
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    .arma:hover, .arma:focus-visible { border-color: var(--azul); outline: none; }
    .arma span { color: var(--tenue); font-size: 12px; }
    .teclas { color: var(--tenue); font-size: 12px; }
    #estado { margin: 0; min-height: 18px; color: var(--tenue); font-size: 12.5px; }
  </style>
</head>
<body>
  <header>
    <h1>Abismo Carmesí</h1>
    <p class="sub">Prototipo · Fase 2 · combate y enemigos</p>
  </header>

  <main id="marco">
    <canvas id="juego" width="512" height="352" aria-label="Área de juego"></canvas>
    <div id="menu">
      <h2>Elige arma</h2>
      <p>Tres perfiles distintos definidos en <code>data/weapons.json</code>.</p>
      <div id="armas"></div>
      <p class="teclas">← → mover · Espacio saltar · J/X atacar · ↑ ↓ apuntar el golpe · Esc menú</p>
    </div>
  </main>

  <p id="estado">Cargando datos…</p>
  <script type="module" src="./src/presentation/main.js"></script>
</body>
</html>
